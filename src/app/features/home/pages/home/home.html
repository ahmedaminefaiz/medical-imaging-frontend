<div class="flex min-h-screen flex-col items-center justify-center gap-4 bg-slate-50 px-4">
  <p class="text-slate-700">
    Connecté en tant que <span class="font-medium">{{ authService.currentUser()?.email }}</span>
  </p>

  <button
    type="button"
    (click)="onLogout()"
    class="rounded-md border border-slate-300 px-3 py-2 text-sm font-medium text-slate-700 transition-colors hover:bg-slate-100"
  >
    Déconnexion
  </button>
</div>
